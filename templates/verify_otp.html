<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Verify OTP</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light d-flex align-items-center vh-100">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-5">
                <div class="card shadow border-0 p-4 rounded-4">
                    <h3 class="fw-bold text-center mb-2">Enter Verification Code 🔢</h3>
                    <p class="text-muted text-center mb-4">OTP sent to <strong>{{ email }}</strong></p>
                    
                    {% if error %}
                        <div class="alert alert-danger py-2">{{ error }}</div>
                    {% endif %}

                    <form method="POST">
                        {% csrf_token %}
                        <div class="mb-3">
                            <input type="text" name="otp" class="form-control text-center fs-4" placeholder="6-Digit OTP" maxlength="6" required>
                        </div>
                        <button type="submit" class="btn btn-success w-100 py-2 fw-bold">Verify & Login</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
