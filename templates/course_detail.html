<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>{{ course.title }}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-md-8">
                <div class="card shadow border-0 rounded-4 overflow-hidden">
                    {% if course.image %}
                        <img src="{{ course.image.url }}" class="card-img-top" style="height: 350px; object-fit: cover;" alt="{{ course.title }}">
                    {% elif course.image_url %}
                        <img src="{{ course.image_url }}" class="card-img-top" style="height: 350px; object-fit: cover;" alt="{{ course.title }}">
                    {% else %}
                        <img src="https://images.unsplash.com/photo-1517694712202-14dd9538aa97" class="card-img-top" style="height: 350px; object-fit: cover;" alt="{{ course.title }}">
                    {% endif %}
                    
                    <div class="card-body p-4">
                        <h2 class="fw-bold text-dark mb-3">{{ course.title }}</h2>
                        <p class="text-muted fs-6 mb-4">{{ course.description }}</p>
                        <h3 class="text-primary fw-bold mb-4">₹ {{ course.price }}</h3>
                        <a href="{% url 'dashboard' %}" class="btn btn-secondary px-4 py-2">Back to Dashboard</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
