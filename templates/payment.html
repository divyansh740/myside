<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Payment - {{ course.title }}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light d-flex align-items-center justify-content-center" style="min-height: 100vh;">

    <div class="card shadow p-4 text-center" style="max-width: 400px; width: 100%;">
        <h3 class="mb-3">Checkout</h3>
        <p class="text-muted">{{ course.title }}</p>
        <h2 class="text-success mb-4">₹{{ course.price }}</h2>

        <button id="pay-btn" class="btn btn-success btn-lg w-100">Pay Now (Demo)</button>
    </div>

    <script>
        document.getElementById('pay-btn').onclick = function() {
            alert('Demo Payment Successful! 🎉');
            window.location.href = "{% url 'payment_success' course.id %}";  // Redirecting to home after success
        };
    </script>

</body>
</html>
